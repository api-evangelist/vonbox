name: VonBox
description: VonBox operated as Vonjour (vonjour.com), a Santa Monica, CA cloud communications
  startup offering phone, text messaging, and contact center services for small businesses,
  backed by 500 Global (then 500 Startups) and Kima Ventures circa 2014-2015, including a
  Vonjour for 500 Startups perk program. The vonjour.com website is no longer live (DNS
  resolves but HTTP does not respond), and no public API, developer documentation, or client
  packages are published. The founding team (Daniel Tawfik, Aman Fahimullah) went on to build
  ZenPatient (zenpatient.com), a digital health platform, and the company GitHub organization
  github.com/Vonjour is now branded ZenPatient.
